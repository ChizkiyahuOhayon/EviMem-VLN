name: ci

on:
  push:
  pull_request:

jobs:
  phase0:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q evimem gavln llava trl vggt tests scripts
      - run: python -m pytest -q
      - run: python -m gavln.gavln_eval --help
      - run: bash -n scripts/create_env.sh scripts/download_mp3d.sh scripts/stage_assets.sh scripts/run_gavln_baseline.sh scripts/run_evimem.sh
